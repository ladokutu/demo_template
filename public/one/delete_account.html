<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Penghapusan Data</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      
      <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
          <h5 class="mb-0">Permintaan Penghapusan Data</h5>
        </div>

        <div class="card-body">
          <p class="text-muted">
            Silakan isi form di bawah ini untuk mengajukan penghapusan data.  
            Permintaan akan diproses sesuai kebijakan privasi kami.
          </p>

          <form action="delete_process.php" method="POST" onsubmit="return confirm('Yakin ingin menghapus data ini?');">

            <div class="mb-3">
              <label class="form-label">Nama Lengkap</label>
              <input type="text" name="fullname" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Email Terdaftar</label>
              <input type="email" name="email" class="form-control" required>
            </div>

            <div class="mb-3">
              <label class="form-label">Alasan Penghapusan</label>
              <textarea name="reason" class="form-control" rows="3" required></textarea>
            </div>

            <div class="form-check mb-3">
              <input class="form-check-input" type="checkbox" id="confirm" required>
              <label class="form-check-label" for="confirm">
                Saya memahami bahwa data yang dihapus tidak dapat dikembalikan
              </label>
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-danger">
                Hapus Data
              </button>
            </div>

          </form>
        </div>

        <div class="card-footer text-muted text-center small">
          © 2025 Ladokutu One
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
